name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared portfolio
        if: ${{ hashFiles('portfolio-source.zip') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          with zipfile.ZipFile('portfolio-source.zip') as archive:
              for entry in archive.infolist():
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError('Invalid archive path')
                  if entry.filename.startswith(('.github/', '.git/')):
                      continue
                  archive.extract(entry, root)
          PY
          git rm portfolio-source.zip
          git add .
          git -c user.name='TDDD' -c user.email='247834106+tyuityuitddd@users.noreply.github.com' commit -m "Import portfolio source and optimized artwork"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify personal website repository
        shell: bash
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "${REPOSITORY,,}" != "${OWNER,,}.github.io" ]]; then
            echo 'This portfolio uses your personal GitHub Pages address. Name the repository USERNAME.github.io.'
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

