media:
  input: public/media
  output: media
  extensions: [png, jpg, jpeg, webp, gif]
  rename: safe
content:
  - name: works
    label: 作品管理
    type: collection
    path: content/works
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: slug
      sort: order
      order: asc
      fields: [slug, category, published, order]
    fields:
      - name: slug
        label: 網址代號（英文、數字、短橫線）
        type: string
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: 每件作品使用不同代號，例如 character-2026。發佈後避免修改。
      - name: published
        label: 顯示在網站
        type: boolean
        default: true
        description: 關閉後不顯示於網站，但公開 GitHub 儲存庫內的檔案仍然公開。
      - name: order
        label: 排序（數字越小越前面）
        type: number
        default: 100
      - name: category
        label: 作品分類
        type: select
        required: true
        options:
          values:
            - { name: illustration, label: 插畫 }
            - { name: game, label: 遊戲 }
            - { name: design, label: 設計 }
      - name: showText
        label: 顯示名稱與介紹
        type: boolean
        default: false
        description: 只想展示圖片就關閉；遊戲或設計專案要顯示文字時開啟。
      - name: title
        label: 作品名稱（關閉顯示時僅供管理）
        type: object
        fields:
          - { name: zh, label: 繁體中文, type: string, required: true }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: description
        label: 作品介紹（選填）
        type: object
        fields:
          - { name: zh, label: 繁體中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: images
        label: 圖片（第一張作為封面，可調整順序）
        type: object
        required: true
        list:
          min: 1
          collapsible: true
        fields:
          - { name: src, label: 圖片, type: image, required: true }
          - { name: alt, label: 圖片簡短說明, type: string, required: true }
      - name: video
        label: 影片網址（選填）
        type: string
        description: YouTube 或 Vimeo 可直接播放，其他 HTTPS 網址以連結顯示。
  - name: settings
    label: 個人資訊與首頁
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: name, label: 中文名稱, type: string, required: true }
      - { name: brand, label: 品牌, type: string, required: true }
      - { name: email, label: 公開聯絡信箱, type: string, required: true }
      - { name: avatar, label: 個人圖片, type: image, required: true }
      - name: bio
        label: 個人簡介
        type: object
        fields:
          - { name: zh, label: 繁體中文, type: text, required: true }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: hero
        label: 首頁四張主視覺的作品代號
        type: string
        list:
          min: 4
          max: 4
        description: 填入作品網址代號，依序為左上、右上、左下、右下。

  - name: journal
    label: Godot 開發日誌
    type: collection
    path: content/journal
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, published]
    fields:
      - { name: slug, label: 文章網址代號, type: string, required: true, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      - { name: title, label: 文章標題, type: string, required: true }
      - { name: excerpt, label: 列表摘要, type: text, required: true }
      - name: date
        label: 發文日期（YYYY-MM-DD）
        type: string
        required: true
        pattern: '^\d{4}-\d{2}-\d{2}$'
        description: 一般文章填發文日期；回顧文章填有依據的階段日期，並另填補記日期。日期用於排序，不是預約發文。
      - { name: updated, label: 最後修改日期（選填 YYYY-MM-DD）, type: string }
      - { name: retrospective, label: 這是事後整理的開發回顧, type: boolean, default: false }
      - { name: recordedOn, label: 補記日期（回顧文章填 YYYY-MM-DD）, type: string }
      - { name: period, label: 階段日期顯示（選填，例如 9 月中旬）, type: string }
      - { name: sourceNote, label: 文末紀錄說明（選填）, type: text }

      - name: published
        label: 公開文章
        type: boolean
        default: false
        description: 關閉是草稿，不會出現在網站；公開 GitHub 儲存庫內的檔案仍可被查看。
      - name: tags
        label: 標籤
        type: string
        list: true
      - { name: cover, label: 封面圖片（選填）, type: image }
      - { name: coverAlt, label: 封面簡短說明, type: string }
      - name: sections
        label: 文章段落（可新增與調整順序）
        type: object
        required: true
        list:
          min: 1
          collapsible: true
        fields:
          - { name: heading, label: 小標題（選填）, type: string }
          - name: text
            label: 內文
            type: text
            description: 直接輸入文字，空一行分段。不需要寫程式或 Markdown。
          - { name: image, label: 進度截圖（選填）, type: image }
          - { name: alt, label: 圖片簡短說明, type: string }
          - { name: caption, label: 圖片下方文字（選填）, type: string }
          - { name: video, label: YouTube 或 Vimeo 影片網址（選填）, type: string }
